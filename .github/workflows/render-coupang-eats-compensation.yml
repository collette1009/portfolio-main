name: Render Coupang Eats Compensation Resume
on:
  push:
    paths:
      - '.github/workflows/render-coupang-eats-compensation.yml'
      - 'coupang-eats-compensation-ops/resume.html'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare print source
        run: cp coupang-eats-compensation-ops/resume.html coupang-eats-compensation-ops/resume-pdf.html
      - name: Render and verify PDF
        run: |
          python3 -m pip install --quiet playwright pymupdf
          python3 - <<'PY'
          import asyncio, fitz
          from pathlib import Path
          from playwright.async_api import async_playwright
          root=Path.cwd()
          html=(root/'coupang-eats-compensation-ops/resume-pdf.html').resolve().as_uri()
          pdf=root/'coupang-eats-compensation-ops/오희은_이력서_쿠팡이츠서비스_가맹점보상운영기획_최종.pdf'
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True, executable_path='/usr/bin/google-chrome', args=['--no-sandbox'])
                  page=await browser.new_page()
                  await page.goto(html, wait_until='networkidle')
                  await page.pdf(path=str(pdf), format='A4', print_background=True, scale=0.88, margin={'top':'0','right':'0','bottom':'0','left':'0'})
                  await browser.close()
          asyncio.run(main())
          d=fitz.open(pdf)
          print('Pages:', len(d))
          if len(d) != 2:
              raise SystemExit(f'Expected 2 pages, got {len(d)}')
          for i,page in enumerate(d):
              pix=page.get_pixmap(matrix=fitz.Matrix(1.35,1.35), alpha=False)
              pix.save(f'coupang-eats-compensation-ops/_verify-page{i+1}.png')
          PY
      - name: Commit outputs
        run: |
          git config user.name 'collette1009'
          git config user.email 'gldms1009@gmail.com'
          git add coupang-eats-compensation-ops/resume-pdf.html coupang-eats-compensation-ops/*.pdf coupang-eats-compensation-ops/_verify-page1.png coupang-eats-compensation-ops/_verify-page2.png
          git commit -m 'Render corrected Coupang Eats compensation operations resume PDF'
          git push
