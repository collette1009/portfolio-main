name: Finalize Coupang Eats compensation application

on:
  push:
    paths:
      - '.github/workflows/finalize-coupang-eats-compensation.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Polish portfolio and resume copy
        shell: python
        run: |
          from pathlib import Path

          def apply(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {path}: {old[:80]}')
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

          portfolio = 'coupang-eats-compensation-ops/index.html'
          apply(portfolio, [
              ('보상 이슈를 건별 처리로 끝내지 않고,<br>기준·증빙·정산·시스템 흐름으로 다시 정리했습니다.', '보상 예외를 건별 처리로 끝내지 않고,<br>기준·증빙·정산·시스템 흐름을 하나씩 정리해 왔습니다.'),
              ('초록마을에서 배송 사고의 보상 기준과 증빙 요건을 파트너와 다시 협의하고, 확정액·면세 여부를 내부 기준과 교차 확인했습니다. 대량 예외는 고객 영향과 기한으로 우선순위화한 뒤 반복 입력을 자동화했고, VOC와 시스템 오류는 데이터 분류·재현·개발 협업으로 개선했습니다. 새로운 정책도 먼저 판단 기준과 예외를 구조화해 운영 가능한 형태로 만드는 방식으로 일해왔습니다.', '초록마을에서 배송 사고의 보상 기준과 증빙 요건을 파트너와 다시 협의하고, 확정액·면세 여부를 내부 기준과 맞춰 확인했습니다. 대량 예외는 고객 영향과 기한에 따라 순서를 정한 뒤 반복 입력만 자동화했고, 반복 VOC는 직접 분류해 원인을 확인했습니다. 시스템 오류는 재현 자료를 만들어 개발팀과 수정 완료까지 확인했고, 새 정책이 생기면 판단 기준과 예외를 먼저 정리해 현장에서 바로 쓸 수 있게 만들었습니다.'),
              ('손실 보상 운영, 정산 검증, 데이터 기반 개선, 시스템·프로세스 고도화를<br>각각 따로 보지 않고 하나의 운영 흐름으로 다뤘습니다.', '손실 보상, 정산 검증, VOC 분석, 시스템 오류와 반복 업무 개선을<br>한 흐름 안에서 함께 맡아왔습니다.'),
              ('정산 검증·비용 관점', '정산 검증·비용 관리'),
              ('데이터 기반 이슈 분석', 'VOC 분석·운영 기준'),
              ('반복 문의 173건을 전수 분류해 142건(82.1%)의 주원인을 확인하고, 개발과 운영정책 중 적절한 대응 방식을 선택했습니다.', '반복 문의 173건을 전수 분류해 142건(82.1%)의 주원인을 확인하고, 운영 기준으로 먼저 막을 부분과 개발이 필요한 부분을 나눴습니다.'),
              ('SOP·협업 운영', 'SOP·유관부서 협업'),
              ('조직 공백에서 누적 8명의 지원 인력을 위한 SOP·FAQ·에스컬레이션 기준을 정리하고 품질을 검수했습니다.', '조직 공백에서 누적 8명의 지원 인력을 위한 SOP·FAQ·에스컬레이션 기준을 정리했고, 파트너·개발·운영 부서와 보상·시스템 이슈를 조율했습니다.'),
              ('‘회수 없이는 보상 불가’였던 기준을, 택배사 자체 약관을 근거로 다시 협의했습니다.', '회수·입고 확인이 먼저 필요하던 사고 기준을, 택배사 자체 약관을 근거로 다시 협의했습니다.'),
              ('고객 편의만을 이유로 예외를 요청하지 않고 파트너의 사전 통보·사고 조치 의무를 기준으로 질문을 다시 세웠고, 이후 실물 회수 없이 사진으로 사고를 확인하는 처리 흐름이 제안·적용됐습니다.', '예외를 부탁하는 대신 택배사 약관의 통보·사고 조치 의무를 근거로 기존 회수 절차를 다시 확인했고, 이후 실물 회수 없이 사진으로 사고를 확인하는 방식이 협의·적용됐습니다.'),
              ('단순 예외 요청이 아니라 택배사 표준약관의 사전 통보 의무와 사고 발생 시 조치 의무를 기준으로, 실제 사고 상황에서 그 의무를 어떻게 이행할지 재질문했습니다. 이후 파트너와 사진을 통한 사고 확인·자체 폐기 방식의 처리 흐름을 협의했습니다.', '단순 예외 요청이 아니라 택배사 표준약관의 사전 통보 의무와 사고 발생 시 조치 의무를 근거로 기존 회수 절차를 다시 확인했습니다. 이후 파트너와 사진으로 사고를 확인하고 고객이 자체 폐기할 수 있는 방식을 협의했습니다.'),
              ('<b>Learning</b><p>파트너 협의는 ‘고객이 불편하다’는 주장보다 상대가 이미 가진 기준을 실제 운영 상황에 대입해 모순과 실행 책임을 묻는 방식이 더 효과적이었습니다.</p>', '<b>운영 원칙</b><p>예외를 부탁하기보다 상대가 이미 쓰는 기준을 실제 상황에 대입해 확인하는 쪽이 협의가 빨랐습니다.</p>'),
              ('<b>Learning</b><p>대량 운영에서는 처리량 자체보다 우선순위 기준과 자동화 가능한 구간을 먼저 나누는 것이 중요했습니다.</p>', '<b>운영 원칙</b><p>대량 처리에서는 먼저 처리할 일과 자동화할 수 있는 일을 나눴습니다.</p>'),
              ('<b>Learning</b><p>데이터는 기능 개발을 정당화하기 위한 숫자가 아니라, 어떤 해결 수단이 가장 비용 효율적인지 판단하기 위한 근거였습니다.</p>', '<b>운영 원칙</b><p>데이터는 기능을 만들지 말지를 정하는 근거로 썼습니다.</p>'),
              ('<b>Learning</b><p>자동화·시스템은 정상 작동을 전제로 두기보다 운영자가 검증 가능한 실패 조건을 갖고 있어야 했습니다.</p>', '<b>운영 원칙</b><p>오류는 “안 된다”라고 전달하기보다 재현 조건을 남겨야 수정이 빨랐습니다.</p>'),
              ('<b>Learning</b><p>대규모 운영에서 정책 품질은 개인 숙련보다 공통 필드, 예외 기준, 변경 이력 관리에 좌우됐습니다.</p>', '<b>운영 원칙</b><p>정책이 많을수록 공통 항목과 예외 기준을 먼저 맞췄습니다.</p>'),
              ('핵심 · 약관을 보상 의무의 직접 근거로 과장하지 않고, 파트너의 통보·사고조치 기준을 협의 근거로 삼아 증빙·회수 프로세스를 재정렬', '핵심 · 약관을 보상 의무의 직접 근거로 쓰지 않고, 통보·사고조치 기준을 근거로 회수·증빙 절차를 다시 협의'),
              ('핵심 · 대량 예외의 우선순위화 + 정형 입력 자동화 + 리소스 재산정', '핵심 · 처리 순서 정하기 + 반복 입력 자동화 + 필요한 인력 다시 계산'),
              ('핵심 · 173건 전수 분류 → 주원인 142건(82.1%) 확인 → 운영정책과 개발 필요성 분리', '핵심 · 173건 전수 분류 → 주원인 142건(82.1%) 확인 → 운영 기준으로 풀 부분과 개발할 부분 구분'),
              ('핵심 · 운영 오류 재현·증빙 → 개발 원인 확인 → 수정 완료까지 후속 검증', '핵심 · 오류 재현 자료 전달 → 개발 원인 확인 → 실제 수정 여부까지 확인'),
              ('핵심 · 400여 파트너 정책을 공통 속성·예외·변경 기준으로 구조화해 동일 판단이 가능한 SOP 기반 마련', '핵심 · 400여 제휴사 정책을 같은 항목과 확인 순서로 정리해 담당자마다 다르게 판단하지 않도록 함'),
              ('Claude, ChatGPT, Gemini, NotebookLM — 초안·코딩·기준 검토에 활용하고 최종 판단은 실제 정책과 운영 흐름으로 검증', 'Claude, ChatGPT, Gemini, NotebookLM — 초안 작성·간단한 코드 작성·원문 비교에 사용. 최종 판단은 사내 기준과 실제 증빙으로 확인'),
              ('보상은 많이 주거나 적게 주는 문제가 아니라,<br>누가 봐도 같은 기준으로 판단하고 정산까지 검증할 수 있는 운영 구조의 문제라고 생각합니다.', '보상 업무는 많이 주고 적게 주는 문제가 아니라,<br>담당자가 달라도 같은 기준으로 판단하고 정산까지 확인할 수 있어야 한다고 생각합니다.')
          ])

          resume_pairs = [
              ('<strong>보상·정산 운영에서 기준과 증빙을 구조화하고, 비용·리스크·운영 효율을 함께 관리해온 운영 담당자입니다.</strong><br>초록마을에서 배송 사고 보상 프로세스를 운영하며 택배사 약관과 실제 처리 흐름을 기준으로 증빙·회수 요건을 재협의했고, 같은 비교 월 기준 배상 회수액은 50만원대에서 약 744만원으로 확대됐습니다. 대량 예외 1,928건은 고객 영향·기한으로 우선순위화하고 반복 입력을 7→1단계로 단순화해 지원 인력을 3명에서 2명으로 재산정했습니다. VOC·시스템 오류는 데이터 분류·재현·개발 협업으로 개선하고, SOP·검수·온보딩 기준을 운영했습니다.', '<strong>보상 기준과 증빙 요건을 정리하고, 비용·리스크·처리 효율까지 함께 봐온 운영 담당자입니다.</strong><br>초록마을에서 배송 사고 보상 업무를 맡아 택배사 약관과 실제 처리 절차를 기준으로 증빙·회수 요건을 다시 협의했고, 같은 비교 월 기준 배상 회수액은 50만원대에서 약 744만원으로 늘었습니다. 대량 예외 1,928건은 고객 영향과 기한에 따라 순서를 정하고 반복 입력을 7→1단계로 줄여 지원 인력을 3명에서 2명으로 재산정했습니다. 반복 VOC는 직접 분류해 원인을 확인했고, 시스템 오류는 재현 자료를 만들어 개발팀과 수정 완료까지 확인했습니다. 조직 공백 때는 SOP·검수·온보딩 기준도 맡았습니다.'),
              ('정산 검증·비용 관점', '정산 검증·비용 관리'),
              ('데이터 기반 운영 개선', 'VOC 분석·운영 개선'),
              ('반복 VOC를 원인 단위로 전수 분류하고 문의 규모·구현 복잡도를 함께 보고 운영정책과 개발 필요성을 구분했습니다.', '반복 VOC를 원인별로 전수 분류하고 문의 규모와 구현 복잡도를 비교해, 운영 기준으로 먼저 막을 부분과 개발이 필요한 부분을 나눴습니다.'),
              ('정형 입력은 자동화하고 운영 오류는 재현·증빙해 개발 원인 확인과 수정 완료까지 후속 검증했습니다.', '정형 입력은 자동화하고 운영 오류는 재현 자료를 만들어 개발팀에 전달한 뒤 실제 수정 여부까지 확인했습니다.'),
              ('주문 이후 배송·환불·재배송·물류 사고와 보상 예외를 운영하며, 반복 이슈를 정책·검증 기준·시스템 개선으로 연결했습니다.', '주문 이후 배송·환불·재배송·물류 사고와 보상 예외를 맡았고, 반복되는 문제는 건별 처리로 끝내지 않고 기준을 고치거나 시스템 수정으로 이어지게 했습니다.'),
              ('파손·누수 사고에서 실물 회수를 우선하던 기준을 택배사 자체 약관의 통보·사고조치 기준으로 재협의 → <strong>사진 증빙 기반 사고 확인·자체 폐기 흐름</strong>으로 정렬.', '파손·누수 사고에서 실물 회수를 우선하던 기준을 택배사 자체 약관의 통보·사고조치 기준으로 재협의 → <strong>사진으로 사고를 확인하고 고객이 자체 폐기할 수 있는 방식</strong>으로 변경.'),
              ('총 <strong>1,928건</strong>을 고객 영향·기한으로 우선순위화하고 반복 등록을', '총 <strong>1,928건</strong>의 고객 영향과 기한을 보고 처리 순서를 정하고 반복 등록을'),
              ('문의 규모와 구현 복잡도를 함께 보고 운영정책과 개발 필요성 분리.', '문의 규모와 구현 복잡도를 함께 보고 운영 기준으로 먼저 막을 부분과 개발이 필요한 부분을 구분.'),
              ('조직 공백에서 누적 <strong>8명</strong> 지원 인력의 SOP·FAQ·예외·에스컬레이션 기준을 재정비하고 답변/처리 방향을 검수.', '조직 공백에서 누적 <strong>8명</strong> 지원 인력의 SOP·FAQ·예외·에스컬레이션 기준을 정리하고 답변/처리 방향을 검수.'),
              ('SELECTED EXPERIENCE · PROBLEM → ACTION → RESULT → LEARNING', 'SELECTED EXPERIENCE · PROBLEM → ACTION → RESULT → PRINCIPLE'),
              ('<b>Learning</b><p>협의는 예외 요청보다 상대 기준을 실제 운영에 대입할 때 강해졌습니다.</p>', '<b>Principle</b><p>예외를 부탁하기보다 상대가 이미 쓰는 기준을 실제 상황에 대입해 협의했습니다.</p>'),
              ('<b>Learning</b><p>정산 운영은 처리 속도만큼 기준 일치 여부를 확인하는 단계가 중요했습니다.</p>', '<b>Principle</b><p>확정 금액을 그대로 받지 않고 내부 기준과 한 번 더 맞춰보는 절차를 뒀습니다.</p>'),
