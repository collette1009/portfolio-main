              ('Excel (VBA·피벗·XLOOKUP)<br>Google Sheets', 'Excel (VBA·피벗·XLOOKUP)<br>SQL (기본 조회) · Google Sheets'),
              ('정책·금액이 걸린 업무는 추측하지 않고 원문과 내부 기준을 교차 확인합니다. 자동화된 결과도 실패 조건과 최종 확인 단계를 남기고, 반복되는 예외는 개인 판단이 아니라 SOP와 체크포인트로 바꿉니다.', '정책·금액이 걸린 업무는 추측하지 않고 원문과 내부 기준을 다시 확인합니다. 자동화한 업무도 최종 확인 단계를 남기고, 반복되는 예외는 담당자마다 다르게 처리되지 않도록 SOP와 확인 항목으로 남깁니다.')
