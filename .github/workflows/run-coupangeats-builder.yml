name: Run Coupang Eats Application Builder

on:
  push:
    paths:
      - '.github/workflows/run-coupangeats-builder.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute builder embedded in source file
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/build-coupangeats-compensation.yml').read_text(encoding='utf-8')
          code = src.split("python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          cleaned = []
          for line in code.splitlines():
              cleaned.append(line[10:] if line.startswith('          ') else line)
          exec(compile('\n'.join(cleaned), 'coupangeats_builder.py', 'exec'))
          PY

      - name: Render PDF and verification pages
        run: |
          PDF="$GITHUB_WORKSPACE/coupangeats-compensation/오희은_이력서_쿠팡이츠서비스_가맹점보상운영기획_최종.pdf"
          google-chrome --headless --no-sandbox --disable-gpu \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=7000 \
            --print-to-pdf="$PDF" \
            --print-to-pdf-no-header \
            "file://$GITHUB_WORKSPACE/coupangeats-compensation/resume-pdf.html"
          test -s "$PDF"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          test "$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')" = "2"
          pdftoppm -png -r 110 -f 1 -singlefile "$PDF" "$GITHUB_WORKSPACE/coupangeats-compensation/_verify-page1"
          pdftoppm -png -r 110 -f 2 -singlefile "$PDF" "$GITHUB_WORKSPACE/coupangeats-compensation/_verify-page2"

      - name: Commit package and clean temporary workflows
        run: |
          git config user.name 'collette1009'
          git config user.email 'gldms1009@gmail.com'
          git add coupangeats-compensation/
          git rm .github/workflows/build-coupangeats-compensation.yml
          git rm .github/workflows/run-coupangeats-builder.yml
          git commit -m 'Add Coupang Eats compensation operations application package'
          git push
