name: Verify Toss CX Ads Resume

on:
  push:
    paths:
      - '.github/workflows/finalize-tosscx-ads.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render PDF pages for visual verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          PDF="$GITHUB_WORKSPACE/tosscx-ads/오희은_이력서_토스CX_Operations_Manager_광고제품운영_최종.pdf"
          pdftoppm -png -r 120 "$PDF" "$GITHUB_WORKSPACE/tosscx-ads/_verify"
          mv "$GITHUB_WORKSPACE/tosscx-ads/_verify-1.png" "$GITHUB_WORKSPACE/tosscx-ads/_verify-page1.png"
          mv "$GITHUB_WORKSPACE/tosscx-ads/_verify-2.png" "$GITHUB_WORKSPACE/tosscx-ads/_verify-page2.png"
          test -s "$GITHUB_WORKSPACE/tosscx-ads/_verify-page1.png"
          test -s "$GITHUB_WORKSPACE/tosscx-ads/_verify-page2.png"

      - name: Commit verification images
        run: |
          git config user.name 'collette1009'
          git config user.email 'gldms1009@gmail.com'
          git add tosscx-ads/_verify-page1.png tosscx-ads/_verify-page2.png
          git commit -m 'Add temporary Toss CX resume verification renders'
          git push
