name: Final copy cleanup for Coupang Eats resume

on:
  push:
    paths:
      - '.github/workflows/finalize-coupang-eats-copy-pass2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stiff resume wording
        shell: python
        run: |
          from pathlib import Path
          pairs = [
            ('400여 개 제휴 골프장의 연락처·운영시간·취소기한·위약범위·동반자 제한을 <strong>공통 속성과 확인 순서</strong>로 재구성해 판단 기준 표준화.', '400여 개 제휴 골프장의 연락처·운영시간·취소기한·위약범위·동반자 제한을 <strong>같은 항목과 확인 순서</strong>로 정리해 팀에서 같은 기준으로 확인할 수 있게 함.'),
            ('<b>Result</b><p>사진 증빙·자체 폐기 흐름으로 정렬, 비교 월 회수액 50만원대→약 744만원.</p>', '<b>Result</b><p>사진으로 사고를 확인한 뒤 고객이 자체 폐기할 수 있게 했고, 비교 월 회수액은 50만원대→약 744만원.</p>'),
            ('<b>Result</b><p>보상 집행 전 검증 단계에서 금액·기준 차이를 확인하는 체크포인트를 운영했습니다.</p>', '<b>Result</b><p>금액과 기준이 다른 건은 보상 집행 전에 다시 확인했습니다.</p>'),
            ('<h3>1,928건을 우선순위화하고 반복 등록 7→1단계</h3>', '<h3>1,928건의 처리 순서를 정하고 반복 등록 7→1단계</h3>'),
            ('<h3>VOC 173건을 분석해 운영정책과 개발 필요성 분리</h3>', '<h3>VOC 173건을 분석해 운영 기준으로 풀 일과 개발할 일을 구분</h3>'),
            ('<b>Result</b><p>142건(82.1%) 주원인을 확인하고 운영정책으로 먼저 관리할 구간을 구분했습니다.</p>', '<b>Result</b><p>142건(82.1%)의 주원인을 확인하고 운영 기준으로 먼저 대응할 부분을 나눴습니다.</p>')
          ]
          for path in ['coupang-eats-compensation-ops/resume.html', 'coupang-eats-compensation-ops/resume-pdf.html']:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected text: {old}')
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
      - name: Render final PDF
        shell: bash
        run: |
          PDF='coupang-eats-compensation-ops/오희은_이력서_쿠팡이츠서비스_가맹점보상운영기획_최종.pdf'
          HTML="file://${GITHUB_WORKSPACE}/coupang-eats-compensation-ops/resume-pdf.html"
          google-chrome --headless=new --no-sandbox --disable-gpu --run-all-compositor-stages-before-draw --virtual-time-budget=5000 --no-pdf-header-footer --print-to-pdf="$PDF" "$HTML"
          test -s "$PDF"
      - name: Commit final resume
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coupang-eats-compensation-ops/resume.html coupang-eats-compensation-ops/resume-pdf.html 'coupang-eats-compensation-ops/오희은_이력서_쿠팡이츠서비스_가맹점보상운영기획_최종.pdf'
          git commit -m 'Finish Coupang Eats resume copy cleanup'
          git push
