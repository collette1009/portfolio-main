name: Extract Resume Profile Photo
on:
  push:
    paths:
      - '.github/workflows/extract-profile-photo.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract embedded profile image
        run: |
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils imagemagick >/dev/null
          mkdir -p /tmp/pdfimgs coupang-eats-compensation-ops/assets
          PDF='tosscx-ads/오희은_이력서_토스CX_Operations_Manager_광고제품운영_최종.pdf'
          pdfimages -png "$PDF" /tmp/pdfimgs/img
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          candidates=[]
          for p in Path('/tmp/pdfimgs').glob('*.png'):
              try:
                  im=Image.open(p)
                  w,h=im.size
                  ratio=w/h if h else 0
                  if w>=80 and h>=100 and 0.65 <= ratio <= 0.95:
                      candidates.append((w*h,p,w,h))
              except Exception:
                  pass
          if not candidates:
              raise SystemExit('No portrait-shaped embedded image found')
          _,src,w,h=max(candidates)
          print('Selected',src,w,h)
          Image.open(src).convert('RGB').save('coupang-eats-compensation-ops/assets/profile.jpg', quality=95)
          PY
      - name: Commit profile photo
        run: |
          git config user.name 'collette1009'
          git config user.email 'gldms1009@gmail.com'
          git add coupang-eats-compensation-ops/assets/profile.jpg
          git commit -m 'Add durable profile image for Coupang Eats resume'
          git push
