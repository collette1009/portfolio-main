          portfolio_body = r'''
<header class="top"><div class="w"><div class="brand">OH HEE EUN / COMPENSATION OPERATIONS</div><nav class="nav"><a href="#fit">직무 연결</a><a href="#work">사례</a><a href="#support">기타 운영</a><a href="resume.html">이력서</a></nav></div></header>
