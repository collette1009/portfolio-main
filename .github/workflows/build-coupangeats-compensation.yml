<div class="sec"><div class="st">WORK STYLE</div><p class="note">문서화된 기준과 원문을 먼저 확인하고, 애매한 조건은 추측하지 않고 확인한 뒤 기준에 반영합니다. 비용·보상 관련 항목은 확정값을 그대로 수용하기보다 근거와 예외를 다시 확인하고, 반복 업무는 사람이 판단해야 할 구간과 자동화 가능한 구간을 나눠 개선합니다.</p></div><div class="pageno">2 / 2</div></section>
