          resume = '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오희은 | 쿠팡이츠서비스 가맹점 보상 운영 기획 이력서</title><style>'+rcss+'</style></head><body>'+resume_body+'</body></html>'
          (out/'resume-pdf.html').write_text(resume, encoding='utf-8')
          (out/'resume.html').write_text(resume, encoding='utf-8')

          # Hard validation against common stale/wrong strings and required anchors.
          combined = portfolio + resume
          banned = ['토스씨엑스', '카드/제품운영', '광고/제품운영', '우아한청년들', '169건', '81.07', '일 6~10건', '5년 이상']
          for x in banned:
              if x in combined:
                  raise SystemExit(f'Banned stale string found: {x}')
          required = ['가맹점 보상 운영 기획 담당자', '약 14.7배', '1,928건', '7→1단계', '173건', '142건(82.1%)', '400여 개', '누적 8명']
          for x in required:
              if x not in combined:
                  raise SystemExit(f'Required string missing: {x}')
          PY

      - name: Render PDF and verification pages
        run: |
          PDF="$GITHUB_WORKSPACE/coupangeats-compensation/오희은_이력서_쿠팡이츠서비스_가맹점보상운영기획_최종.pdf"
          google-chrome --headless --no-sandbox --disable-gpu \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=7000 \
            --print-to-pdf="$PDF" \
            --print-to-pdf-no-header \
            "file://$GITHUB_WORKSPACE/coupangeats-compensation/resume-pdf.html"
          test -s "$PDF"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          test "$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')" = "2"
          pdftoppm -png -r 110 -f 1 -singlefile "$PDF" "$GITHUB_WORKSPACE/coupangeats-compensation/_verify-page1"
          pdftoppm -png -r 110 -f 2 -singlefile "$PDF" "$GITHUB_WORKSPACE/coupangeats-compensation/_verify-page2"

