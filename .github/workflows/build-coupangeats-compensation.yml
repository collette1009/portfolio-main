<div class="modal" id="m01"><div class="panel"><div class="mh"><div><small>01 / COMPENSATION POLICY · 약 14.7배</small><h3>‘회수 없이는 보상 불가’였던 사고 기준을 파트너 자체 약관을 근거로 다시 협의했습니다.</h3></div><button class="x" aria-label="닫기">×</button></div><div class="mb"><div class="d"><b>Problem</b><p>파손 사고 접수에 외부박스·운송장·내품 사진과 실물 회수가 일률적으로 요구돼, 고객이 위험한 파손 상품을 보관하거나 추가 증빙을 포기하면 배상 접수도 중단될 수 있었습니다.</p></div><div class="d"><b>Judgment</b><p>고객 불편을 이유로 개별 예외를 요청하는 방식만으로는 파트너의 ‘회수 없이는 보상 불가’ 원칙을 바꾸기 어려웠습니다. 파트너가 스스로 정한 통보·사고 조치 의무가 실제 운영에서 어떻게 이행되는지로 논점을 바꿨습니다.</p></div><div class="d"><b>Action</b><p>택배 표준약관의 재포장 시 송화인 통보 의무와 사고 발생 시 조치 의무를 근거로 재협의했습니다. 이후 실제 운영에서는 택배사 전산에 사고 이력이 있는 건은 추가 사진·실물 회수 없이 주문내역서로 접수하고, 미등록 건은 사진 3종 대신 겉박스 파손 사진 1장으로 사고를 확인하도록 증빙 기준을 나눴습니다.</p></div><div class="d"><b>Result</b><p>반복 증빙과 위험 상품 보관 부담을 줄이고 기존 요건 때문에 중단되던 사고를 배상으로 연결했습니다. 비교 월 배상 회수액은 50만 원대에서 약 744만 원으로 확대됐습니다.</p></div><div class="flow"><div>회수 없이는 보상 불가</div><div>약관으로 논점 전환</div><div>사고 이력·증빙 기준 분리</div><div>배상 접수 연결</div></div><div class="res">비교 월 배상 회수액 · 50만 원대 → 약 744만 원 · 약 14.7배<br><span style="font-weight:400;color:#777">※ 약관이 ‘회수 없는 보상’을 직접 규정했다고 해석하지 않고, 파트너의 통보·조치 책임을 짚어 협상 논점을 바꾼 근거로 사용했습니다.</span></div></div></div></div>

<div class="modal" id="m02"><div class="panel"><div class="mh"><div><small>02 / SETTLEMENT · COST · 계약 기준</small><h3>3PL 귀책 피해와 회사 선처리 비용을 계약 기준으로 묶어 정산 자료로 관리했습니다.</h3></div><button class="x" aria-label="닫기">×</button></div><div class="mb"><div class="d"><b>Problem</b><p>출고 누락·포장 불량·파손 등 3PL 귀책 피해가 발생하면 회사가 먼저 처리한 환불·재배송·CS 보상 비용을 어떤 근거로 익월 물류비에 반영할지 정리가 필요했습니다.</p></div><div class="d"><b>Action</b><p>물류 계약서 원문을 기준으로 피해 유형·회사 선처리 비용·차감 예정액·조정 가능 항목을 월별로 정리했습니다. 파트너가 제시한 확정액 중 본사 기준과 맞지 않거나 추가 확인이 필요한 건은 별도로 표시했습니다.</p></div><div class="d"><b>Result</b><p>실제 피해와 계약 조항을 연결한 정산 협의 자료를 만들고, 확정액을 그대로 수용하지 않고 재검토할 수 있는 구조로 관리했습니다.</p></div><div class="d"><b>Learning</b><p>정산 정확도는 금액 자체보다 어떤 피해가 어떤 근거로 반영됐는지 추적 가능하게 만드는 데서 시작됐습니다.</p></div><div class="mini-table"><div class="mr head"><span>관리 항목</span><span>확인 기준</span><span>후속 처리</span></div><div class="mr"><span>출고 누락 / 포장 불량 / 파손</span><span>계약 조항·실제 피해</span><span>차감 예정액 산정</span></div><div class="mr"><span>환불액 / 재배송비 / CS 보상</span><span>회사 선처리 비용</span><span>익월 비용 반영</span></div><div class="mr"><span>이견·확인 필요 건</span><span>본사 기준 재검토</span><span>조정 항목 분리</span></div></div></div></div></div>

<div class="modal" id="m03"><div class="panel"><div class="mh"><div><small>03 / AUTOMATION · OPERATIONS · 1,928건</small><h3>대량 예외 1,928건을 우선순위로 나누고 반복 등록을 자동화한 뒤 필요한 인력까지 다시 계산했습니다.</h3></div><button class="x" aria-label="닫기">×</button></div><div class="mb"><div class="d"><b>Problem</b><p>외부 물류 운영사 전환 직후 재배송 1,151건과 취소 777건이 동시에 발생했고, 반복 입력까지 겹쳐 처리 지연 위험이 컸습니다.</p></div><div class="d"><b>Action</b><p>고객 약속·재고·후속 기한을 기준으로 재배송을 먼저 처리하고, 관리자 화면의 정형 입력은 Chrome Extension으로 자동화했습니다. 귀책·금액·최종 처리처럼 확인이 필요한 값은 사람이 검수하도록 남겼습니다.</p></div><div class="d"><b>Result</b><p>총 1,928건을 유형과 처리 시점으로 나눠 운영했고 반복 등록 동선을 7단계에서 1단계로 줄였습니다. 자동화 적용 후 필요한 지원 인력도 3명에서 2명으로 다시 산정했습니다.</p></div><div class="d"><b>Learning</b><p>자동화는 입력을 대신하는 데서 끝나는 게 아니라, 사람이 책임져야 할 판단 구간을 분명하게 남길 때 안정적으로 작동했습니다.</p></div><div class="res">1,928건 · 반복 등록 7→1단계 · 지원 인력 3→2명 재산정</div><div class="ev two"><figure><img src="../operations-case-archive/assets/case1-admin.png" alt="비식별 관리자 자동입력 화면"><figcaption>비식별 증빙 · Chrome Extension 적용 후 정형 필드 자동입력</figcaption></figure><figure><img src="../operations-case-archive/assets/case1-announce.png" alt="비식별 자동화 사용 안내"><figcaption>비식별 증빙 · 반복 운영 자동화 기능의 내부 사용 안내</figcaption></figure></div></div></div></div>

<div class="modal" id="m04"><div class="panel"><div class="mh"><div><small>04 / DATA · POLICY · 173건 / 82.1%</small><h3>1+1 문의 173건을 전수 분석해, 개발보다 운영정책이 적합한 구간을 구분했습니다.</h3></div><button class="x" aria-label="닫기">×</button></div><div class="mb"><div class="d"><b>Problem</b><p>1+1 혜택 미적용 문의가 반복됐지만 고객이 실제로 어느 조건에서 오인하는지 근거가 없어 처리 방식이 흔들릴 수 있었습니다.</p></div><div class="d"><b>Action</b><p>VOC 173건을 전수 분류해 문구 미인지 142건(82.1%), 정책 기준 혼동 12건, 홀수 수량 알림 부재 19건으로 나눴습니다. 화면 개선의 예외 케이스와 구현 복잡도도 함께 확인했습니다.</p></div><div class="d"><b>Result</b><p>즉시 개발보다 운영정책으로 먼저 관리할 구간을 구분하고, 초회 예외 처리와 재인입 시 정책 안내·종결 기준을 분리했습니다.</p></div><div class="d"><b>Learning</b><p>운영비용을 줄이는 결정은 문의량만 보는 것이 아니라 원인 규모와 구현 비용을 함께 비교해야 했습니다.</p></div><div class="res">173건 → 문구 미인지 142건(82.1%) · 정책 기준 혼동 12건 · 홀수 수량 알림 부재 19건</div><div class="ev"><figure><img src="../operations-case-archive/assets/voc173-evidence.png" alt="비식별 VOC 원인 집계표"><figcaption>비식별 증빙 · 1+1 미적용 VOC 173건 원인 집계</figcaption></figure></div></div></div></div>

<div class="modal" id="m05"><div class="panel"><div class="mh"><div><small>05 / SYSTEM VALIDATION · 당일 수정</small><h3>배송조회 오류를 재현 가능한 조건으로 정리해 개발팀의 원인 확인과 수정 완료까지 후속 관리했습니다.</h3></div><button class="x" aria-label="닫기">×</button></div><div class="mb"><div class="d"><b>Problem</b><p>관리자 주문상세에서 일부 배송조회가 정상 동작하지 않아 운영자가 매번 별도 확인을 반복해야 했습니다.</p></div><div class="d"><b>Action</b><p>관리자 화면과 조회 실패 화면을 함께 정리하고 정상·실패 조건을 재현해 개발팀에 전달했습니다. 원인을 찾은 뒤 수정 완료 여부와 실제 동작까지 후속 확인했습니다.</p></div><div class="d"><b>Result</b><p>개발팀이 요청값 형식 문제를 확인해 프론트에서 처리했고 같은 날 수정 완료됐습니다.</p></div><div class="d"><b>Learning</b><p>시스템 검증은 ‘오류가 있다’는 보고보다 입력 조건·실패 화면·재현 경로를 함께 남길 때 해결 속도가 높아졌습니다.</p></div><div class="res">운영 오류 재현·증빙 → 개발 원인 확인 → 프론트 수정 → 당일 정상 동작 확인</div><div class="ev two"><figure><img src="../operations-case-archive/assets/case7-admin-redacted.png" alt="비식별 관리자 배송조회 화면"><figcaption>비식별 증빙 · 배송조회 조건을 확인한 관리자 화면</figcaption></figure><figure><img src="../operations-case-archive/assets/case7-error-redacted.png" alt="비식별 배송조회 실패 화면"><figcaption>비식별 증빙 · 동일 조건에서 배송조회 실패가 재현된 화면</figcaption></figure></div></div></div></div>

