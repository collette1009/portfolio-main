<div class="sec"><div class="st">SELECTED EXPERIENCE · PROBLEM → ACTION → RESULT → LEARNING</div><div class="cases">
<div class="case"><small>COMPENSATION POLICY</small><h3>사고 증빙·회수 기준을 재협의해 배상 접수 흐름 개선</h3><div class="quad"><b>Problem</b><p>일률적인 사진·실물 회수 요건으로 접수가 중단될 수 있었습니다.</p><b>Action</b><p>파트너 자체 약관으로 협상 논점을 전환하고 사고 이력 여부에 따라 증빙 기준을 나눴습니다.</p><b>Result</b><p>기존 요건 때문에 중단되던 사고를 배상으로 연결해 비교 월 회수액이 50만 원대→약 744만 원으로 확대됐습니다.</p><b>Learning</b><p>보상 기준은 심사 통제를 유지하면서 불필요한 증빙 부담을 줄여야 지속적으로 작동했습니다.</p></div></div>
<div class="case"><small>SETTLEMENT / COST</small><h3>3PL 피해와 선처리 비용을 계약 근거로 정산 자료화</h3><div class="quad"><b>Problem</b><p>파트너 귀책 피해와 회사 선처리 비용을 정산에 반영할 공통 기준이 필요했습니다.</p><b>Action</b><p>계약 조항·피해 유형·차감 예정액·조정 가능 항목을 월별로 정리하고 확인 필요 건을 분리했습니다.</p><b>Result</b><p>실제 피해와 계약 근거를 연결한 익월 정산 협의 자료를 운영했습니다.</p><b>Learning</b><p>정산은 금액보다 근거와 예외를 추적 가능한 형태로 남기는 것이 중요했습니다.</p></div></div>
<div class="case"><small>AUTOMATION / OPERATIONS</small><h3>1,928건 예외를 우선순위화하고 반복 등록을 7→1단계로 축소</h3><div class="quad"><b>Problem</b><p>대량 배송 예외와 반복 입력이 동시에 쌓였습니다.</p><b>Action</b><p>고객 영향·기한으로 순서를 나누고 정형 입력과 판단값을 분리해 자동화했습니다.</p><b>Result</b><p>1,928건을 운영하고 7→1단계로 줄인 뒤 지원 인력을 3→2명으로 재산정했습니다.</p><b>Learning</b><p>자동화는 책임이 필요한 판단 구간을 명확히 남길 때 안정적으로 운영됐습니다.</p></div></div>
<div class="case"><small>DATA / POLICY</small><h3>VOC 173건을 분석해 운영정책과 개발 필요성을 분리</h3><div class="quad"><b>Problem</b><p>반복 문의의 실제 원인과 규모에 대한 근거가 없었습니다.</p><b>Action</b><p>173건을 전수 분류하고 화면 개선의 예외·구현 복잡도까지 함께 검토했습니다.</p><b>Result</b><p>142건(82.1%)의 주원인을 확인하고 초회 예외·재인입 처리 기준을 분리했습니다.</p><b>Learning</b><p>운영비용과 개선효과를 함께 봐야 개발 여부와 정책 우선순위를 정할 수 있었습니다.</p></div></div>
</div></div>
