<text x="150" y="897" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">POINT · 고객 불편과 비용 누수를 같은 운영 문제로 보고 파트너 기준 자체를 다시 협의했습니다.</text>
